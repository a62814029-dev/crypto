<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#10151E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#10161F;--card:#1D2633;--pill:#2B3443;--tx:#fff;--mu:#8D9BB5;--up:#3BC47B;--dn:#F2476A;--bl:#3D8BFF;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:400 16px/1.25 Montserrat,Inter,-apple-system,"SF Pro Text",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select{font-family:inherit}
#app{position:relative;max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column}
#main{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 16px 24px;overscroll-behavior-y:contain}
.fade{animation:fd .22s}@keyframes fd{from{opacity:0}}
.top{display:grid;grid-template-columns:88px minmax(0,1fr) 88px;align-items:center;height:64px;margin:0 -4px}
.rt{display:flex;width:88px;justify-content:flex-end;margin-left:0}
.ib{width:44px;height:44px;background:none;border:0;color:var(--mu);display:flex;align-items:center;justify-content:center;padding:0}
.top>.ib{justify-self:start}
.pill{justify-self:center;max-width:100%;min-width:0;background:var(--pill);border:0;border-radius:22px;height:42px;padding:0 11px;color:var(--tx);font-size:15px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px}.pill span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}.pill svg{flex:none}.pill svg:last-child{color:var(--mu)}
.bal{display:flex;justify-content:center;align-items:center;gap:10px;margin:30px 0 8px;font-size:50px;line-height:56px;font-weight:600;letter-spacing:-.03em}.bal small{font-size:32px;margin-left:1px}
.addr{display:flex;justify-content:center;align-items:center;gap:8px;color:var(--mu);font-size:14px}
.w5{background:rgba(59,196,123,.16);color:var(--up);font-size:12px;font-weight:500;padding:5px 8px;border-radius:8px}
.pch{text-align:center;font-size:13px;margin-top:8px}
.acts{display:grid;grid-template-columns:repeat(3,72px);justify-content:center;gap:28px;margin:28px 0 30px}
.act{background:none;border:0;color:var(--mu);font-size:13px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0}
.act span{width:52px;height:52px;border-radius:50%;background:var(--card);color:#fff;display:flex;align-items:center;justify-content:center;transition:transform .15s,background .15s}
.act:active span{transform:scale(.92);background:var(--pill)}
.sec{display:flex;justify-content:space-between;align-items:center;margin:0 4px 12px;font-size:18px;font-weight:500}
.sec span,.sec button{display:flex;align-items:center;gap:6px}.sec span svg{color:var(--mu)}.sec button{background:none;border:0;color:var(--mu);font-size:14px;font-weight:500}
.grp{background:var(--card);border-radius:24px;overflow:hidden}.grp .row{position:relative;background:none;border-radius:0;margin:0;padding:16px;min-height:76px}.grp .row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:rgba(255,255,255,.06)}
.row{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:20px;padding:12px 16px;margin-bottom:8px;transition:background .15s}.grp .row:active{background:rgba(255,255,255,.04)}
.ic{width:44px;height:44px;border-radius:50%;position:relative;flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600}
.ic svg,.ic img{width:44px;height:44px;display:block}.ic img{position:absolute;inset:0;background:var(--card);object-fit:contain}.ic.big,.ic.big svg,.ic.big img{width:56px;height:56px}
.g{flex:1;min-width:0}.r{text-align:right}.nm{font-weight:500;font-size:16px;line-height:21px;font-variant-numeric:tabular-nums}.mu{color:var(--mu);font-size:14px;line-height:20px;margin-top:1px}.up{color:var(--up)}.dn{color:var(--dn)}
.foot{text-align:center;color:var(--mu);font-size:12px;margin-top:18px;opacity:.8}
.tabs{flex:none;display:flex;background:var(--bg);padding:10px 0 4px}
.tabs button{flex:1;background:none;border:0;color:var(--mu);font-size:13px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:4px;transition:color .2s}.tabs .on{color:var(--bl)}
.top2{display:flex;align-items:center;justify-content:space-between;height:60px;font-size:18px;font-weight:600}.pill2{background:var(--pill);border:0;border-radius:16px;color:var(--tx);padding:9px 14px;font-size:13px;font-weight:500}
.row .pill2{padding:8px 11px;flex:none;font-size:12px}.seg{display:flex;gap:6px;margin:10px 0 14px}.seg button{flex:1;background:var(--card);border:0;border-radius:14px;color:var(--mu);padding:9px 0;font-size:12px;font-weight:500}.seg .on{background:var(--pill);color:#fff}
.cen{text-align:center;padding:50px 0}.hd{text-align:center;margin-top:6px}.hd .ic{margin:0 auto 12px}.pr{font-size:34px;font-weight:600;letter-spacing:-.02em;margin:4px 0}
.chart{animation:fd .4s;margin:18px 0 6px;min-height:150px}.two{display:flex;justify-content:space-between;margin:10px 4px;font-size:15px;font-weight:500}
#ptr{position:absolute;left:50%;top:6px;width:36px;height:36px;margin-left:-18px;opacity:0;pointer-events:none;color:var(--bl);z-index:2}#ptr svg{width:36px;height:36px;display:block}.spin svg{animation:rot .8s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.ok path{stroke-dasharray:30;animation:dr .4s forwards}@keyframes dr{from{stroke-dashoffset:30}to{stroke-dashoffset:0}}
#page{position:fixed;inset:0;max-width:480px;margin:0 auto;background:var(--bg);z-index:8;transform:translateX(100%);visibility:hidden;transition:transform .28s,visibility .28s;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px);overflow-y:auto}#page.on{transform:none;visibility:visible}
#toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--pill);padding:10px 16px;border-radius:14px;font-size:13px;opacity:0;transition:opacity .2s;z-index:20;pointer-events:none;max-width:88%;text-align:center}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:12}
#sheet .in{background:var(--bg);width:100%;max-width:480px;max-height:90%;overflow-y:auto;border-radius:24px 24px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.h{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px;font-size:18px;font-weight:600}.h button{background:none;border:0;color:var(--bl);font-size:14px;font-weight:500}
label{display:block;color:var(--mu);font-size:13px;margin:14px 0 6px}
input,select{width:100%;background:var(--card);border:0;border-radius:14px;color:var(--tx);padding:14px;font-size:16px;outline:none}

.err{color:var(--dn);font-size:14px;margin-top:10px}

/* ===== iPhone / mobile Safari layout fixes ===== */
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  position: fixed;
  overscroll-behavior: none;
  -webkit-text-size-adjust: 100%;
}
:root {
  padding-top: 0 !important;
  padding-bottom: 0 !important;
}
#app {
  position: relative;
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  height: 100%;
  height: 100dvh;
  height: -webkit-fill-available;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-height: 0;
  padding-top: env(safe-area-inset-top, 0px);
  box-sizing: border-box;
}
#main {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain;
  padding: 0 16px 12px;
  scrollbar-width: none;
}
#main::-webkit-scrollbar { display: none; }

/* Compact bottom tab bar: ~48px content + safe-area (target 50–58px max without system inset) */
.tabs {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-around;
  gap: 0;
  height: calc(48px + env(safe-area-inset-bottom, 0px));
  min-height: calc(48px + env(safe-area-inset-bottom, 0px));
  max-height: calc(50px + env(safe-area-inset-bottom, 0px));
  padding: 2px 4px calc(2px + env(safe-area-inset-bottom, 0px));
  background: rgba(16, 22, 31, 0.98);
  -webkit-backdrop-filter: blur(18px);
  backdrop-filter: blur(18px);
  border-top: 1px solid rgba(255, 255, 255, 0.055);
  z-index: 5;
  box-sizing: border-box;
  overflow: hidden;
}
.tabs button {
  flex: 1;
  min-width: 0;
  min-height: 0;
  height: 100%;
  max-height: 48px;
  padding: 0;
  margin: 0;
  background: none;
  border: 0;
  color: var(--mu);
  font-size: 9.5px;
  font-weight: 500;
  letter-spacing: 0.01em;
  line-height: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  -webkit-appearance: none;
  appearance: none;
  transform: translateZ(0);
  transition: color 0.2s ease, transform 0.16s ease, opacity 0.2s ease;
}
.tabs button.on { color: var(--bl); }
.tabs button svg {
  display: block;
  width: 20px !important;
  height: 20px !important;
  min-width: 20px;
  min-height: 20px;
  flex: 0 0 20px;
  overflow: visible;
  opacity: 1;
  visibility: visible;
  transform: translateZ(0);
  transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.tabs button:active { transform: scale(0.96); opacity: 0.85; }
.tabs button:active svg { transform: scale(0.92); }

/* Toast above compact bar */
#toast {
  bottom: calc(56px + env(safe-area-inset-bottom, 0px)) !important;
}

/* Keep existing motion polish */
.fade { animation: screenEnter 0.28s cubic-bezier(0.22, 0.75, 0.25, 1) both; }
@keyframes screenEnter {
  from { opacity: 0; transform: translate3d(0, 6px, 0); }
  to { opacity: 1; transform: translate3d(0, 0, 0); }
}
.row { transition: background-color 0.2s ease, transform 0.16s cubic-bezier(0.2, 0.8, 0.2, 1); }
.row:active { transform: scale(0.992); }
#page { transition: transform 0.3s cubic-bezier(0.22, 0.75, 0.25, 1), visibility 0.3s; }
#sheet .in { animation: sheetEnter 0.28s cubic-bezier(0.22, 0.75, 0.25, 1) both; }
@keyframes sheetEnter {
  from { transform: translate3d(0, 20px, 0); opacity: 0.8; }
  to { transform: translate3d(0, 0, 0); opacity: 1; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
  }
}

/* Extra safety for small iPhones */
@media (max-width: 390px) {
  .tabs {
    height: calc(46px + env(safe-area-inset-bottom, 0px));
    min-height: calc(46px + env(safe-area-inset-bottom, 0px));
    max-height: calc(48px + env(safe-area-inset-bottom, 0px));
    padding: 1px 2px calc(1px + env(safe-area-inset-bottom, 0px));
  }
  .tabs button { font-size: 9px; gap: 0; max-height: 46px; }
  .tabs button svg {
    width: 18px !important;
    height: 18px !important;
    min-width: 18px;
    min-height: 18px;
    flex: 0 0 18px;
  }
}

function openWName(){sheet("Название и адрес",`<label>Название кошелька</label><input id="a" value="${esc(S.name)}"><label>Адрес кошелька</label><input id="b" value="${esc(S.addr)}"><button class="btn s" onclick="document.getElementById('b').value=genAddr()">Сгенерировать другой адрес</button><button class="btn" onclick="saveName()">Save</button>`)}
function saveName(){S.name=document.getElementById("a").value.trim()||"Wallet";S.addr=document.getElementById("b").value.trim()||genAddr();save();closeS()}
function openBal(){sheet("Баланс и монеты",`<label>Текущий баланс: ${usd(total())}. Новый баланс, USD</label><input id="b" type="number" inputmode="decimal" placeholder="100000"><div class="mu" style="margin-top:6px">Монеты из списка масштабируются пропорционально; если все по нулям, сумма зачисляется в USDT.</div>${E()}<button class="btn" onclick="saveBal()">Save</button><div class="h" style="margin:22px 0 8px;font-size:17px">Количество и цена монет</div>`+S.show.filter(co).map(x=>`<div class="row" style="padding:8px 10px">${icon(x)}<div class="g"><b>${x}</b></div><input class="mini" type="number" step="any" value="${S.h[x]||0}" onchange="S.h['${x}']=Math.max(0,+this.value||0);save()"><input class="mini" type="number" step="any" value="${P(x)}" onchange="S.px['${x}']=Math.max(0,+this.value||0);save()"></div>`).join("")+`<div class="mu">Первое поле: количество, второе: цена USD.</div>`)}
function saveBal(){const v=document.getElementById("b").value;if(v==="")return closeS();const T=+v,cur=total();if(!(T>=0))return err("Неверная сумма");if(cur>0){const k=T/cur;for(const x in S.h)S.h[x]*=k}else{S.h.USDT=T;if(!S.show.includes("USDT"))S.show.push("USDT")}log("Set balance","USDT",0,T);save();closeS()}
function openWallets(){sheet("Кошельки",`<div class="grp">`+S.ws.map((w,i)=>`<div class="row" onclick="switchW(${i})"><div class="g"><div class="nm">${esc(i===S.cur?S.name:w.name)}</div><div class="mu">${esc(i===S.cur?S.addr:w.addr)}</div></div>${i===S.cur?'<span style="width:10px;height:10px;border-radius:50%;background:var(--bl)"></span>':""}</div>`).join("")+`</div><label>Новый кошелёк</label><input id="a" placeholder="Название"><button class="btn" onclick="addW()">Добавить кошелёк</button>`+(S.ws.length>1?`<button class="btn d" onclick="delW()">Удалить текущий кошелёк</button>`:""))}
function switchW(i){if(i!==S.cur){save();S.cur=i;const w=S.ws[i];WK.forEach(k=>S[k]=w[k]);save();note(S.name)}closeS()}
function addW(){const n=document.getElementById("a").value.trim();save();const w={name:n||"Wallet "+(S.ws.length+1),addr:genAddr(),h:{},show:DS(),hist:[],stk:{}};S.ws.push(w);S.cur=S.ws.length-1;WK.forEach(k=>S[k]=w[k]);save();closeS()}
function delW(){if(!confirm("Удалить кошелёк «"+S.name+"»?"))return;S.ws.splice(S.cur,1);S.cur=0;WK.forEach(k=>S[k]=S.ws[0][k]);save();closeS()}
function resetW(){if(!confirm("Обнулить этот кошелёк?"))return;S.h={};S.show=DS();S.hist=[];S.stk={};save();closeS()}
let busy=false;
async function refresh(force){if(busy)return false;if(!force&&S.upd&&Date.now()-S.upd<432e5)return true;busy=true;let ok=false;
 try{const ids=all().filter(c=>c.id).map(c=>c.id).join(",");const r=await fetch("https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&per_page=250&sparkline=true&price_change_percentage=24h&ids="+ids);if(!r.ok)throw 0;const d=await r.json();d.forEach(x=>{const c=all().find(k=>k.id===x.id);if(c){S.px[c.s]=x.current_price;S.chg[c.s]=x.price_change_percentage_24h;S.img[c.s]=x.image;S.mc[c.s]=x.market_cap;S.vol[c.s]=x.total_volume;S.hi[c.s]=x.high_24h;S.lo[c.s]=x.low_24h;const p=x.sparkline_in_7d&&x.sparkline_in_7d.price;if(p)S.spk[c.s]=p.filter((_,i)=>i%4===0).map(n=>+n.toPrecision(6))}});S.upd=Date.now();save();ok=true}catch(e){}
 busy=false;if(ok)render();return ok}
const SP='<svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="13" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="60 100"/></svg>';
const OKI='<svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="13" fill="none" stroke="currentColor" stroke-width="3"/><path d="M11 19l5 5 9-10" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ERI='<svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="13" fill="none" stroke="#F2476A" stroke-width="3"/><path d="M18 11v9M18 24.500v.5" stroke="#F2476A" stroke-width="3" stroke-linecap="round"/></svg>';
{const mn=document.getElementById("main"),pt=document.getElementById("ptr");let y0=0,pd=0,pull=false,pb=false;pt.innerHTML=SP;
 const setP=(d,a)=>{mn.style.transition=a?"transform .25s":"none";mn.style.transform=d?`translateY(${d}px)`:"";pt.style.transition=a?"opacity .25s":"none";pt.style.opacity=Math.min(d/45,1);if(!pb)pt.firstChild.style.transform=`rotate(${d*5}deg)`};
 mn.addEventListener("touchstart",e=>{pull=tab==="w"&&!pb&&mn.scrollTop<=0;y0=e.touches[0].clientY;pd=0},{passive:true});
 mn.addEventListener("touchmove",e=>{if(!pull)return;const d=e.touches[0].clientY-y0;if(d<=0||mn.scrollTop>0){if(pd){pd=0;setP(0)}return}pd=Math.min(d*.5,90);if(e.cancelable)e.preventDefault();setP(pd)},{passive:false});
 mn.addEventListener("touchend",async()=>{if(!pull)return;pull=false;if(pd<60){setP(0,true);return}
  pb=true;setP(56,true);pt.className="spin";pt.innerHTML=SP;pt.firstChild.style.transform="";const t0=Date.now();const ok=await refresh(true);if(Date.now()-t0<700)await new Promise(r=>setTimeout(r,700-(Date.now()-t0)));
  pt.className=ok?"ok":"";pt.innerHTML=ok?OKI:ERI;note(ok?"Обновлено · "+new Date(S.upd).toLocaleTimeString():"Нет связи с API — показаны сохранённые данные");await new Promise(r=>setTimeout(r,900));setP(0,true);await new Promise(r=>setTimeout(r,300));pt.className="";pt.innerHTML=SP;pb=false});}
setInterval(()=>refresh(false),6e5);document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh(false)});
render();refresh(false);
/* ensure start at top without visible jump */
requestAnimationFrame(function(){
  var m=document.getElementById("main");
  if(m) m.scrollTop=0;
  window.scrollTo(0,0);
});
</script></body></html>
